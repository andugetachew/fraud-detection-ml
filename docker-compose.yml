services:
  redis:
    image: redis:7-alpine

  api:
    build: .
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    working_dir: /app/serving
    ports:
      - "8088:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/4
    depends_on:
      - redis
    volumes:
      - ./training:/app/training
      - ./serving:/app/serving
      - ./artifacts:/app/artifacts
      - ./data:/app/data

  worker:
    build: .
    command: python -m celery -A celery_app worker --loglevel=info
    working_dir: /app/training
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/4
    depends_on:
      - redis
    volumes:
      - ./training:/app/training
      - ./artifacts:/app/artifacts
      - ./data:/app/data

  beat:
    build: .
    command: python -m celery -A celery_app beat --loglevel=info
    working_dir: /app/training
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/4
    depends_on:
      - redis
    volumes:
      - ./training:/app/training
      - ./artifacts:/app/artifacts
      - ./data:/app/data