services:
  redis:
    image: redis:7-alpine

  api:
    build: .
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    working_dir: /app/serving
    ports:
      - "8088:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/4
    depends_on:
      - redis
    volumes:
      - ./training:/app/training
      - ./serving:/app/serving
      - ./artifacts:/app/artifacts
      - ./data:/app/data

  worker:
    build: .
    command: python -m celery -A celery_app worker --loglevel=info
    working_dir: /app/training
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/4
    depends_on:
      - redis
    volumes:
      - ./training:/app/training
      - ./artifacts:/app/artifacts
      - ./data:/app/data

  beat:
    build: .
    command: python -m celery -A celery_app beat --loglevel=info
    working_dir: /app/training
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/4
    depends_on:
      - redis
    volumes:
      - ./training:/app/training
      - ./artifacts:/app/artifacts
      - ./data:/app/data

  kafka:
    image: apache/kafka:3.8.0
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    ports:
      - "9092:9092"

  stream-producer:
    build: .
    command: python producer.py
    working_dir: /app/streaming
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    volumes:
      - ./training:/app/training
      - ./streaming:/app/streaming
      - ./data:/app/data

  stream-consumer:
    build: .
    command: python consumer.py
    working_dir: /app/streaming
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/4
    depends_on:
      - kafka
      - redis
    volumes:
      - ./training:/app/training
      - ./serving:/app/serving
      - ./streaming:/app/streaming
      - ./artifacts:/app/artifacts
      - ./data:/app/data